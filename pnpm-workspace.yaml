packages:
  - packages/*
  - apps/*
  - tools/*

# pnpm blocks dependency install scripts unless listed here.
onlyBuiltDependencies:
  - koffi # selects its prebuilt binary
  - unrs-resolver # checks its prebuilt binary (used by eslint-plugin-import-x)

# Ships prebuilt binaries per platform; its install script only builds from source as a fallback.
ignoredBuiltDependencies:
  - '@parcel/watcher'
